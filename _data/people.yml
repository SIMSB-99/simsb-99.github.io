sections:
  - id: mentees
    title: Mentees
    description: >-
      Students I currently mentor on research projects spanning privacy, AI, and extended reality.
    people:
      - name: Kim Giordano
        relationship: Undergraduate Research Mentee
        affiliation: Virginia Tech
        period: June 2026–Present
        description: >-
          I mentor Kim on research examining privacy policies and transparent sensor-data usage in extended reality, with a focus on making sensing practices more understandable to people affected by XR systems.
        site_visible: true

      - name: Amulya Chinnala
        relationship: Undergraduate Research Mentee
        affiliation: Virginia Tech
        period: June 2026–Present
        description: >-
          I mentor Amulya on research at the intersection of AI alignment and privacy, studying how intelligent systems can better reflect human privacy expectations.
        site_visible: true

